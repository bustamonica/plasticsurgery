[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphengine"
version = "0.1.0"
description = "Implant-parameterized chest morph engine + synthetic data factory for augmentation visualization (M0+M1)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "trimesh>=4.0", "pydantic>=2.6",
                "manifold3d>=2.3", "mapbox-earcut>=1.0", "rtree>=1.2",
                "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
painter = ["torch>=2.2", "diffusers>=0.30", "peft>=0.11", "accelerate>=0.30",
           "transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morphengine = ["implants/data/*.json"]
