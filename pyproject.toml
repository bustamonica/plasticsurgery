[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphengine"
version = "0.1.0"
description = "Implant-parameterized chest morph engine for augmentation visualization (M0)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "trimesh>=4.0", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morphengine = ["implants/data/*.json"]
